<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <script src="theme.js"></script>
</head>
<body >
    <header>
        <div class="site-topbar">
            <a class="logo" href="index.html">
                <!-- CHANGED: logo.jpeg -> images/logo.jpeg (the image now lives in the images folder) -->
                <img src="images/logo.jpeg" alt="SVU logo">
            </a>

            <h1 class="title">Syrian Virtual University Events</h1>

            <nav class="site-navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <!-- Dark mode toggle: theme.js fills in the text and handles the click -->
                    <li><button id="theme-toggle" class="btn btn-outline-light btn-sm" type="button">Dark</button></li>
                </ul>
            </nav>
        </div>
        
        <h1 lang="ar" class="contact-title">تواصل معنا</h1>
    </header>

    <main class="p-5 my-4">
        <div class="row g-5 justify-content-center">
            <div class="col-md-5">
                <div class="form-panel h-100 p-4 rounded">
                    <h4>Send us your info <br> and the event details</h4>
                    <div id="formAlert" class="alert d-none" role="alert"></div>
                    <form class="theform mt-5" id="theform">
                        <ul>
                            <li>
                                <label for="fullname" class="form-label">Full Name</label>
                                <input type="text" id="fullname" class="form-control">
                            </li>
                            <li>
                                <label for="emailaddress" class="form-label">Email Address</label>
                                <input type="email" id="emailaddress" class="form-control">
                            </li>
                            <li>
                                <label for="message" class="form-label">Message</label>
                                <textarea type="text" id="message" class="form-control" style="resize: none;"> </textarea>
                            </li>
                        </ul>
                        <button type="submit" class="btn btn-primary mt-3">Submit!</button>
                    </form>
                </div>
            </div>
            <div class="col-md-5">
                <div class="info-panel h-100 p-4 rounded">
                    <h4>You can find us on</h4>
                    <div class="d-flex contact-method">
                        <!-- CHANGED: mail.png -> images/mail.png -->
                        <img src="images/mail.png" class="icons" alt="Email Icon">
                        <!-- CHANGED: href="user@example.com" -> href="mailto:user@example.com" (without "mailto:" the browser treats it as a file name, not an email address) -->
                        <p class="fw-bold">Email <br><a href="mailto:user@example.com">user@example.com</a></p>
                    </div>
                    <div class="d-flex contact-method">
                        <!-- CHANGED: media.png -> images/media.png -->
                        <img src="images/media.png" class="icons" alt="Media Icon">
                        <!-- CHANGED: youtube.png -> images/youtube.png and facebook.jpg -> images/facebook.jpg (the YouTube and Facebook links themselves are online addresses, so they stay the same) -->
                        <p class="fw-bold">Media <br><a href="https://www.youtube.com/channel/UCJwPgp0tOp1ZqkzbmDvFSaw"><img src="images/youtube.png" alt="YouTube" class="media-icons"></a>
                            <a href="https://www.facebook.com/svuonline.org"><img src="images/facebook.jpg" alt="Facebook" class="media-icons"></a></p>
                    </div>
                    <div class="d-flex contact-method">
                        <!-- CHANGED: location.jpg -> images/location.jpg -->
                        <img src="images/location.jpg" class="icons" alt="Email Icon">
                        <p class="fw-bold">Location <br><a href="https://maps.app.goo.gl/voeSrimQv9Pw2D2i7">click here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <br>
    <footer class="site-footer">
        <p>&copy; 2026 Syrian Virtual University</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- UNCHANGED: contact.js sits in the same folder as this page, so the plain file name is correct -->
    <script src="contact.js"></script>
</body>
</html>
