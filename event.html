<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>events details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <script src="theme.js"></script>
</head>
<body>
    <header>
        <div class="site-topbar">
            <a class="logo" href="index.html">
                <img src="images/logo.jpeg" alt="SVU logo">
            </a>

            <h1 class="title">Syrian Virtual University Events</h1>

            <nav class="site-navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>
<main dir="rtl">
    <section class="event_info">
        <h2 id="event_title"> عنوان الفعالية</h2>
        <p id="event_date">الزمان  </p>
        <p id="event_location"> المكان </p>
    </section>

    <section class="event_map">
        <h3 class="section_title">موقع الفعالية</h3>
        <img id="event_map" src="" alt="خريطة موقع الفعالية">
    </section>

    <section class="event_description">
        <h3 class="section_title"> عن الفعالية</h3>
        <p id="event_description"> وصف الفعالية</p>
    </section>

    <section class="event_gallery">
        <div id="gallery_img">
        <img src="" alt="صور عن الفعالية" id="images1">
        <img src="" alt="صور عن الفعالية" id="images2"> 
        <img src="" alt="صور عن الفعالية" id="images3">
        </div>
    </section>

    <input type="button" value="مشاركة الفعالية " class="event_button">
    <input type="button" value="إضافة الفعالية الي التقويم"class="event_button"> 

    <section class="semilar_event">
    <h2 class="section_title">فعاليات مشابهة</h2>
    <div class="semilar_card_event">
        <div class="card_1">
        <img src="" alt="صورة الفعالية" id="similar_image_1">
        <h3 class="section_title" id="similar_title_1">عنوان الفعالية</h3>
        <p id="similar_description_1">وصف الفعالية</p>
        <a class="event_button" id="similar_link_1">عرض التفاصيل</a>
        
    </div>
            <div class="card_2">
        <img src="" alt="صورة الفعالية" id="similar_image_2">
        <h3 class="section_title" id="similar_title_2">عنوان الفعالية</h3>
        <p id="similar_description_2">وصف الفعالية</p>
        <a class="event_button" id="similar_link_2">عرض التفاصيل</a>
    </div>
    </div>
    </section>

    <footer class="site-footer">
        <p>&copy; 2026 Syrian Virtual University</p>
    </footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="event.js"></script>
</body>
</html>
